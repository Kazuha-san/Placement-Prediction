name: Keep backend & database awake

# Temporary: only needed while grading/review is happening this month.
# Delete this file (or disable the workflow under the repo's Actions tab)
# once you no longer need 24/7 uptime - there's no reason to keep pinging
# a free-tier service indefinitely.

on:
  schedule:
    # Every 10 minutes. Render's free tier spins down after ~15 min idle,
    # so 10 minutes keeps a comfortable margin. This same request also hits
    # the database, which resets Supabase's much longer (~1 week) inactivity
    # timer, so one workflow covers both.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend + database
        run: |
          curl -sf --max-time 30 "${{ secrets.BACKEND_URL }}/health/db" \
            && echo "Backend + DB reachable" \
            || (echo "Ping failed" && exit 1)
            